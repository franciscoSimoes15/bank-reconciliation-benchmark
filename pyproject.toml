[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-reconciliation-benchmark"
version = "0.1.0"
description = "Reproducible synthetic benchmark for 1:1 bank-reconciliation matching."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RECPAD benchmark project" }]
dependencies = [
  "rapidfuzz==3.14.3",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
recon-benchmark = "recon_benchmark.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
